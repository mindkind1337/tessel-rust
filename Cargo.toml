[package]
name = "tessel-rust"
default-run = "tessel-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Rust Tessel prototype"

[workspace]
members = []
default-members = ["."]
resolver = "3"

[features]
visual-test = ["eframe/__screenshot"]

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
vt100 = { path = "vendor/vt100" }
gpui_ce_elements = { path = "vendor/gpui_ce_elements" }

[dependencies]
regex = "1.13.1"
tessel-host-protocol = { git = "https://github.com/mindkind1337/tessel-host", rev = "78db68d61556bfa59a058080cf9270a8f47301b0" }
tessel-host-client = { git = "https://github.com/mindkind1337/tessel-host", rev = "78db68d61556bfa59a058080cf9270a8f47301b0" }
tessel-host = { git = "https://github.com/mindkind1337/tessel-host", rev = "78db68d61556bfa59a058080cf9270a8f47301b0" }
eframe = "=0.33.0"
gpui = { package = "gpui-ce", version = "0.3" }
gpui_platform = { package = "gpui_ce_platform", version = "0.3" }
gpui_ce_elements = "=0.3.0"
unicode-segmentation = "=1.13.3"
portable-pty = "=0.9.0"
vt100 = "=0.15.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
icu_collator = "=2.4.0"
icu_datetime = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = "=2.4.0"
directories = "6"
tempfile = "3"
bytes = "1"
rfd = "0.15"
fs2 = "0.4"
url = "2"
open = "5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
flate2 = "1.1"
rcgen = "0.14"
base64 = "0.22"
getrandom = "0.4"
subtle = "2"
csv = "1"
calamine = "0.38"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
zeroize = "1"
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "sync", "net", "macros"] }
russh-sftp = "3"
hayro = { version = "0.8", features = ["embed-fonts"] }
cssparser = "0.38"
scraper = "0.29"
pulldown-cmark = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
imgalifier-avif = "0.1.0"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
similar = { version = "2.7.0", default-features = false, features = ["text"] }
oxc_allocator = "=0.160.0"
oxc_span = "=0.160.0"
oxc_ast = "=0.160.0"
oxc_ast_visit = "=0.160.0"
oxc_parser = { version = "=0.160.0", default-features = false }

[target.'cfg(windows)'.dependencies]
wry = "=0.57.1"
webview2-com = "0.39"
dunce = "1"
reqwest = { version="0.12", default-features=false, features=["blocking","json","rustls-tls"] }
webbrowser = "1"
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Networking_WinSock", "Win32_System_WindowsProgramming"] }
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
strip = "debuginfo"

[dev-dependencies]
gpui = { package = "gpui-ce", version = "0.3", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
