[package]
name = "tessel-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Rust Tessel prototype"

[features]
visual-test = ["eframe/__screenshot"]

[dependencies]
eframe = "=0.33.0"
portable-pty = "=0.9.0"
vt100 = "=0.15.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
rfd = "0.15"
fs2 = "0.4"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
base64 = "0.22"
getrandom = "0.4"
subtle = "2"
csv = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
wry = "=0.57.1"
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
