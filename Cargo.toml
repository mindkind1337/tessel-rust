[package]
name = "tessel-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Rust Tessel prototype"

[features]
visual-test = ["eframe/__screenshot"]

[dependencies]
eframe = "=0.33.0"
portable-pty = "=0.9.0"
vt100 = "=0.15.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
rfd = "0.15"
fs2 = "0.4"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
base64 = "0.22"
getrandom = "0.4"
subtle = "2"
csv = "1"
calamine = "0.38"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
zeroize = "1"
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "sync", "net"] }
russh-sftp = "3"
hayro = { version = "0.8", features = ["embed-fonts"] }
scraper = "0.29"
pulldown-cmark = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[target.'cfg(windows)'.dependencies]
wry = "=0.57.1"
webview2-com = "0.39"
dunce = "1"
reqwest = { version="0.12", default-features=false, features=["blocking","json","rustls-tls"] }
sha2 = "0.10"
webbrowser = "1"
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Com_StructuredStorage"] }

[profile.release]
opt-level = 2
strip = "debuginfo"
