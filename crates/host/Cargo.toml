[package]
name = "tessel-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Tessel's remote host daemon: one private socket per user, reached through SSH"

[dependencies]
tessel-host-protocol = { path = "../host-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
