name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: windows-rust-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: windows-rust-v1-
      - run: cargo fmt --check
      - run: cargo test --locked -j 2
      - run: cargo clippy --locked -j 2 --all-targets --all-features -- -D warnings
      - run: cargo build --locked -j 2
      - run: .\target\debug\tessel-rust.exe --self-test-pdf
      - run: .\target\debug\tessel-rust.exe --self-test-office
      - name: Build and verify portable release package
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tessel-rust-windows-x64
          path: |
            target/packages/*.zip
            target/packages/*.sha256
