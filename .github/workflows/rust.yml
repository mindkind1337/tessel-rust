name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:scripts
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate the private host protocol dependency
        env:
          TESSEL_HOST_DEPLOY_KEY: ${{ secrets.TESSEL_HOST_DEPLOY_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TESSEL_HOST_DEPLOY_KEY)) {
            throw 'Configure TESSEL_HOST_DEPLOY_KEY as a read-only tessel-host deploy key. See HOST_PROTOCOL_PLAN.md.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'tessel-host-ci-key'
          $knownHosts = Join-Path $env:RUNNER_TEMP 'tessel-host-known-hosts'
          $keyText = $env:TESSEL_HOST_DEPLOY_KEY.Replace("`r`n", "`n").TrimEnd() + "`n"
          [IO.File]::WriteAllText($keyPath, $keyText, [Text.UTF8Encoding]::new($false))
          $owner = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          # Only the runner owns the file; include DELETE so always() cleanup succeeds.
          icacls $keyPath /inheritance:r /grant:r ('*' + $owner + ':F') | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restrict the CI dependency key.' }
          $meta = Invoke-RestMethod https://api.github.com/meta -Headers @{'User-Agent'='Tessel-Rust-CI'}
          [IO.File]::WriteAllLines($knownHosts, @($meta.ssh_keys | ForEach-Object { 'github.com ' + $_ }), [Text.UTF8Encoding]::new($false))
          $ssh = (Join-Path $env:WINDIR 'System32/OpenSSH/ssh.exe').Replace('\', '/')
          $sshCommand = '"' + $ssh + '" -i "' + $keyPath.Replace('\', '/') + '" -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="' + $knownHosts.Replace('\', '/') + '"'
          $env:GIT_SSH_COMMAND = $sshCommand
          "GIT_SSH_COMMAND=$sshCommand" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          git config --global url.'git@github.com:mindkind1337/tessel-host'.insteadOf 'https://github.com/mindkind1337/tessel-host'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure the private dependency URL.' }
          # Verify real access before any cache can hide an invalid deploy key.
          git ls-remote --exit-code https://github.com/mindkind1337/tessel-host HEAD | Out-Null
          if ($LASTEXITCODE -ne 0) {
            # Public fingerprints and selected SSH diagnostics only; never print the key.
            $keygen = Join-Path $env:WINDIR 'System32/OpenSSH/ssh-keygen.exe'
            $fingerprint = & $keygen -lf $keyPath 2>$null
            if ($LASTEXITCODE -eq 0 -and $fingerprint -match '(SHA256:[A-Za-z0-9+/]+)') {
              Write-Output ('CI deploy key fingerprint: ' + $Matches[1])
            }
            & $ssh -v -T -i $keyPath -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$knownHosts" git@github.com 2>&1 |
              ForEach-Object { [string]$_ } |
              Where-Object { $_ -match 'Offering public key:|Server accepts key:|sign_and_send_pubkey:|Load key |bad permissions|Permission denied|Authenticated to ' }
            throw 'The CI deploy key cannot read tessel-host. Check its read-only deploy key and TESSEL_HOST_DEPLOY_KEY pairing.'
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target/debug
            target/release
          key: windows-rust-v2-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: windows-rust-v2-
      - run: cargo fmt --check
      - run: cargo test --locked -j 2 -- --test-threads=2
      - run: cargo clippy --locked -j 2 --all-targets --all-features -- -D warnings
      - run: cargo build --locked -j 2
      - run: .\target\debug\tessel-rust.exe --self-test-pdf
      - run: .\target\debug\tessel-rust.exe --self-test-office
      - name: Build and verify portable release package
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tessel-rust-windows-x64
          path: |
            target/packages/*.zip
            target/packages/*.sha256
      - name: Remove the dependency key
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'tessel-host-ci-key'
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
